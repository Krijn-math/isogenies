<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>isogeny-based cryptography</title>
    <link rel="icon" href="/favicon.ico?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            /* font-family: monospace; */
            font-family: "Noto Sans Mono", monospace;
            font-optical-sizing: auto;
            font-weight: 250;
            font-style: normal;
            font-size: 10pt;
            font-variation-settings: "wdth" 100;
            display: flex;
            justify-content: center;
        }

        nav {
            margin-right: 2em;
            padding: 1em;
        }

        .spaced-list>li {
            margin-bottom: 1ex;
        }

        hr {
            border: 1px solid gray;
            margin: 2ex 0;
        }

        a {
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        body {
            background-color: #BDEDE0;
            color: #373F51
        }

        a {
            color: #36599b;
        }

        a:visited {
            color: #E26D5C;
        }

        .fulljustify {
            text-align: justify;
        }

        .fulljustify:after {
            content: "";
            display: inline-block;
            width: 100%;
        }

        #tagline {
            height: 80px;
            overflow: hidden;
            line-height: 80px;
            /* vert-center */
        }

        @media (min-width: 100px) {
            ol {
                width: max-width;
            }

            ul {
                width: max-width;
            }

            details {
                width: max-width;
                text-align: justify;
            }

            details>summary {
                padding-left: 20px;
                padding-top: 6px;
                width: max-width;
                cursor: pointer;
            }

            img {
                width: 100%;
            }
        }

        @media (min-width: 500px) {
            ul {
                width: 430px;
                text-align: justify;
            }

            details {
                width: 500px;
                text-align: justify;
            }

            details>summary {
                padding-left: 20px;
                padding-top: 6px;
                width: 500px;
                cursor: pointer;
            }

            img {
                width: 500px;
            }
        }

        h1 {
            text-align: center;
            width: 430px;
            padding-top: 20px;
            padding-left: 40px;
            margin: 0 auto;
        }

        .source {
            color: gray;
        }

        .filters-wrap {
            text-align: center;
            margin-bottom: 2ex;
        }

        #filters {
            display: inline-flex;
            border: 1px solid rgba(55, 63, 81, 0.4);
            border-radius: 0.4em;
            overflow: hidden;
        }

        .filter {
            cursor: pointer;
            padding: 0.4em 1.2em;
            color: #373F51;
        }

        .filter+.filter {
            border-left: 1px solid rgba(55, 63, 81, 0.4);
        }

        .filter.active {
            background-color: rgba(55, 63, 81, 0.12);
            color: #373F51;
        }

        body.hide-eprint .eprint,
        body.hide-arxiv .arxiv {
            display: none;
        }
    </style>
    <link rel="icon" href="favicon.ico" />

<body>
    <main>

        <header>
            <h1>recent isogeny papers</h1>
        </header>
        <br>
        <div class="filters-wrap">
            <div id="filters">
                <span class="filter" data-filter="eprint">ePrint</span>
                <span class="filter" data-filter="arxiv">arXiv</span>
                <span class="filter active" data-filter="both">both</span>
            </div>
        </div>
        <br>
        <h3>this week</h3>
        <ul reversed class="spaced-list" id="last_week"></ul>
        <h3>this month</h3>
        <ul reversed class="spaced-list" id="last_month"></ul>
        <h3>this year</h3>
        <ul reversed class="spaced-list" id="last_year"></ul>

        <center>
            <p>Thanks to arXiv for use of its open access interoperability.</p>
        </center>

        <script>
            function formatAuthors(authorlist) {
                return authorlist.map(function (author, index) {
                    if (index === authorlist.length - 2) {
                        return author + " and ";
                    } else if (index === authorlist.length - 1) {
                        return author;
                    }
                    return author + ", ";
                }).join("");
            }

            function makePaperItem(paper) {
                var listItem = document.createElement('li');
                listItem.style.listStyleType = 'none';

                var titleItem = document.createElement('b');
                titleItem.textContent = paper.title + ". ";

                var authorItem = document.createElement('span');
                authorItem.textContent = formatAuthors(paper.authorlist);

                var floatItem = document.createElement('span');
                floatItem.style = "float:right";

                if (paper.repo != 'none') {
                    var gitItem = document.createElement('a');
                    gitItem.href = paper.repo;
                    gitItem.target = "_blank";
                    gitItem.textContent = "git?";
                    floatItem.appendChild(gitItem);
                    floatItem.appendChild(document.createTextNode('\u00A0\u00A0'));
                }

                var sourceItem = document.createElement('span');
                sourceItem.className = "source";
                // sourceItem.textContent = paper.source + ":\u00A0";
                sourceItem.textContent = "[" + paper.source + "]\u00A0";

                var urlItem = document.createElement('a');
                urlItem.href = paper.linkBase + paper.id;
                urlItem.target = "_blank";
                urlItem.textContent = paper.id;

                floatItem.appendChild(sourceItem);
                // arXiv ids are fixed-width (nnnn.nnnnn); ePrint ids are shorter and
                // variable. Left-pad the id so "source: id" has the same total width
                // for both, keeping the labels aligned in the right-floated column.
                var slotWidth = 15;
                var pad = slotWidth - paper.source.length - paper.id.length;
                if (pad > 0) {
                    floatItem.appendChild(document.createTextNode(' '.repeat(pad)));
                }
                floatItem.appendChild(urlItem);

                listItem.appendChild(titleItem);
                listItem.appendChild(authorItem);
                listItem.appendChild(floatItem);

                return listItem;
            }

            function fetchPapers(file, source, linkBase) {
                return fetch(file)
                    .then(response => response.text())
                    .then(data => {
                        return data.split('\n').filter(function (line) {
                            return line.length > 0;
                        }).map(function (line) {
                            var values = line.split(';;;');
                            return {
                                title: values[0],
                                authorlist: (values[1] || "").split(','),
                                id: values[2],
                                date_class: values[3],
                                repo: values[4],
                                date: values[5] || "",
                                source: source,
                                linkBase: linkBase
                            };
                        });
                    })
                    .catch(function () {
                        return [];
                    });
            }

            Promise.all([
                fetchPapers('papers_eprint.txt', 'ePrint', '//ia.cr/'),
                fetchPapers('papers_arxiv.txt', 'arXiv', '//arxiv.org/abs/')
            ]).then(function (lists) {
                var papers = lists[0].concat(lists[1]);
                papers.sort(function (a, b) {
                    return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
                });
                papers.forEach(function (paper) {
                    var list = document.getElementById(paper.date_class);
                    if (!list) {
                        return;
                    }
                    var sourceClass = paper.source.toLowerCase();
                    var item = makePaperItem(paper);
                    item.className = sourceClass;
                    list.appendChild(item);
                    var spacer = document.createElement('br');
                    spacer.className = sourceClass;
                    list.appendChild(spacer);
                });
            });

            var filters = document.querySelectorAll('.filter');
            filters.forEach(function (filter) {
                filter.addEventListener('click', function () {
                    filters.forEach(function (f) {
                        f.classList.remove('active');
                    });
                    filter.classList.add('active');
                    var choice = filter.dataset.filter;
                    document.body.classList.toggle('hide-eprint', choice === 'arxiv');
                    document.body.classList.toggle('hide-arxiv', choice === 'eprint');
                });
            });
        </script>
        <h1><a href="//krijnreijnders.com" target="_blank">...</a></h1>

</body>

</html>
