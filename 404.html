<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<script>
  /* Short links of the Isogeny Forest: /thesis/<slug> is the redirect page
     /thesis/thesis_data/<slug>.html (generated by thesis/tools/build_links.py).
     GitHub Pages serves this page for any missing path, so forward those there
     and show a plain 404 for everything else. */
  (function () {
    var m = location.pathname.match(/^\/thesis\/([a-z0-9-]+)\/?$/);
    if (m && m[1] !== "thesis_data") location.replace("/thesis/thesis_data/" + m[1] + ".html" + location.hash);
  })();
</script>
</head>
<body style="font-family:Georgia,serif;padding:2em;max-width:36em">
<h1 style="font-weight:normal">Page not found</h1>
<p>Nothing lives at this address. Try the <a href="/">front page</a> or the <a href="/thesis/">Isogeny Forest</a>.</p>
</body>
</html>
